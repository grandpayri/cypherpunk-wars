<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYPHERPUNK WARS | Bunker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bunker-frame">

<div class="viewport">
    <div id="app-header" class="app-header"></div>

    <div class="bunker-shell-wrapper">
        <div class="bunker-shell">
            <div id="sidebar" class="bunker-sidebar"></div>

            <div class="bunker-main">
                <h3 style="color: var(--kaspa-bright); margin-top: 0;">AI_INGESTION_DAEMON</h3>
                <p style="font-size: 0.85rem;">Allocate 1 Cycle and 1 GWh to scrape the BlockDAG for $PUNKW fragments.</p>
                <div style="border: 1px dashed var(--kaspa-teal); padding: 40px; text-align: center; margin: 20px 0;">
                    <button class="btn-execute" onclick="executePhish()">INITIATE_PHISH_SEQUENCE</button>
                </div>
                <div id="log" class="terminal-log">> CONNECTION_STABLE. AWAITING_INSTRUCTION...</div>
            </div>
        </div>

        <div class="docs-footer">
            <button class="nav-link" onclick="window.location.href='gameplay.html'">[DOCS] GAMEPLAY</button>
            <button class="nav-link" onclick="window.location.href='architecture.html'">[DOCS] ARCHITECTURE</button>
            <button class="nav-link" onclick="window.location.href='whitepaper.html'">[DOCS] WHITEPAPER</button>
        </div>
    </div>
</div>

<script type="module">
    import { bootBunkerEngine, getSessionPrivateKey, getSessionPublicKey } from './wallet-gen.js';
    import { deriveRestrictedWalletAddress, spendFromRestrictedWallet, ActionType } from './kaspa-client.js';
    import { renderAppHeader } from './shared-header.js';
    import { renderSidebar } from './shared-sidebar.js';

    renderAppHeader();

    function logLine(msg) {
        const log = document.getElementById('log');
        log.innerHTML += `<br>> ${msg}`;
        log.scrollTop = log.scrollHeight;
    }

    const bunkerId = localStorage.getItem('bunker_id');
    if (!bunkerId) {
        window.location.href = 'index.html';
    }

    window.addEventListener('load', async () => {
        logLine("BOOTING_ENGINE...");
        const ready = await bootBunkerEngine();
        if (!ready) {
            logLine("CRITICAL_ERROR: WASM_ENGINE_OFFLINE");
            return;
        }
        await renderSidebar('sidebar', 'command');
    });

    // Phish no longer logs its outcome inline -- a real gameplay action leaves the command
    // console and lands on a dedicated results page (phish-result.html), which is the only
    // time this page is left except by explicit nav-link navigation.
    window.executePhish = async function () {
        if (!bunkerId) return;

        let privateKey, pubkey;
        try {
            privateKey = getSessionPrivateKey();
            pubkey = getSessionPublicKey();
        } catch (err) {
            logLine("ERROR: SESSION_KEY_UNAVAILABLE. REDIRECTING_TO_RESUME...");
            setTimeout(() => { window.location.href = 'resume.html'; }, 1500);
            return;
        }

        logLine("ALLOCATING_GIGAWATTS...");
        try {
            const restrictedAddr = deriveRestrictedWalletAddress(pubkey);
            const result = await spendFromRestrictedWallet({
                playerAddress: restrictedAddr,
                playerPrivateKey: privateKey,
                playerPubkeyHex: pubkey,
                actionType: ActionType.PHISH,
                extraBytes: new Uint8Array(0),
            });
            const yieldAmount = Math.floor(Math.random() * 40) + 10;
            sessionStorage.setItem('lastPhishResult', JSON.stringify({
                txid: result.txid,
                yieldAmount,
                rewardAmountSompi: result.outputs.reward.toString(),
                changeAmountSompi: result.outputs.change.toString(),
            }));
            window.location.href = 'phish-result.html';
        } catch (err) {
            console.error("PHISH_ERROR:", err);
            logLine(`ERROR: GRID_FAILURE. ${err.message || err}`);
        }
    };
</script>

</body>
</html>
