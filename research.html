<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYPHERPUNK WARS | Research</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bunker-frame">

<div class="viewport">
    <div id="app-header" class="app-header"></div>

    <div class="bunker-shell-wrapper">
        <div class="bunker-shell">
            <div id="sidebar" class="bunker-sidebar"></div>

            <div class="bunker-main">
                <h3 style="color: var(--kaspa-bright); margin-top: 0;">RESEARCH_PROTOCOL</h3>
                <p style="font-size: 0.85rem; color: #888;">
                    COMING_SOON -- spending Cycles to unlock new hack/payload tiers (and the
                    Sectors economy that feeds them) is planned but not yet built. See the
                    project roadmap for details.
                </p>
            </div>
        </div>
    </div>

    <div id="docs-footer" class="docs-footer"></div>
</div>

<script type="module">
    import { bootBunkerEngine } from './wallet-gen.js';
    import { renderAppHeader } from './shared-header.js';
    import { renderSidebar } from './shared-sidebar.js';
    import { renderFooter } from './shared-footer.js';

    renderAppHeader();
    renderFooter();

    window.addEventListener('load', async () => {
        const ready = await bootBunkerEngine();
        if (!ready) return;
        await renderSidebar('sidebar', 'research');
    });
</script>

</body>
</html>
