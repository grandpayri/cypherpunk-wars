[package]
name = "kaspa-zk-convert"
version = "0.1.0"
edition = "2021"

# cdylib so `wasm-pack build --target web` can produce a browser module;
# rlib so src/main.rs (native CLI, for fast local testing without a
# browser) can still link against this crate normally.
[lib]
crate-type = ["cdylib", "rlib"]

# Pinned to the exact versions rusty-kaspa's crypto/txscript uses (see
# https://github.com/kaspanet/rusty-kaspa Cargo.toml workspace deps), so
# serialize_compressed here produces byte-identical output to what its
# OpZkPrecompile verifier deserializes.
[dependencies]
ark-bn254 = "=0.6.0"
ark-ec = "=0.6.0"
ark-ff = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-serialize = "=0.6.0"
ark-snark = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
wasm-bindgen = "0.2"
